replicaCount: 3

image:
  repository: ghcr.io/companybrain/api-server
  pullPolicy: IfNotPresent
  tag: "latest"

workerImage:
  repository: ghcr.io/companybrain/ingestion-worker
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 5001
  metricsPort: 5001

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

workerResources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75

env:
  NODE_ENV: "production"
  PORT: "5001"
  SUPABASE_URL: "https://your-supabase-project.supabase.co"
  REDIS_URL: "redis://redis-master:6379"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /metrics
    initialDelaySeconds: 10
    periodSeconds: 5
