apiVersion: v1
kind: Service
metadata:
  name: {{ include "company-brain.fullname" . }}
  labels:
    app.kubernetes.io/name: company-brain-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: http
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: company-brain-api
