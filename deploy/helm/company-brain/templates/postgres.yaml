{{- if .Values.infra.postgres.enabled }}
{{- $name := include "company-brain.component" (merge (dict "suffix" "postgres") .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: infra
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.infra.postgres.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: infra
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.infra.postgres.image.repository }}:{{ .Values.infra.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.infra.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.infra.postgres.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.infra.postgres.env.POSTGRES_PASSWORD | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.infra.postgres.env.POSTGRES_DB | quote }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.infra.postgres.env.POSTGRES_USER | quote }}, "-d", {{ .Values.infra.postgres.env.POSTGRES_DB | quote }}]
            initialDelaySeconds: {{ .Values.infra.postgres.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.infra.postgres.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.infra.postgres.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.infra.postgres.probes.failureThreshold }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.infra.postgres.env.POSTGRES_USER | quote }}, "-d", {{ .Values.infra.postgres.env.POSTGRES_DB | quote }}]
            initialDelaySeconds: {{ .Values.infra.postgres.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.infra.postgres.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.infra.postgres.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.infra.postgres.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.infra.postgres.resources | nindent 12 }}
          {{- if .Values.infra.postgres.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- end }}
  {{- if .Values.infra.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.infra.postgres.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infra.postgres.persistence.size }}
  {{- else }}
  volumes:
    - name: data
      emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: infra
spec:
  type: {{ .Values.infra.postgres.service.type }}
  ports:
    - port: {{ .Values.infra.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ $name }}
{{- end }}
