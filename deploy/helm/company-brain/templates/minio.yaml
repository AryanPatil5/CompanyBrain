{{- if .Values.infra.minio.enabled }}
{{- $name := include "company-brain.component" (merge (dict "suffix" "minio") .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: infra
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.infra.minio.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: infra
    spec:
      containers:
        - name: minio
          image: "{{ .Values.infra.minio.image.repository }}:{{ .Values.infra.minio.image.tag }}"
          imagePullPolicy: {{ .Values.infra.minio.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":{{ .Values.infra.minio.consolePort }}"]
          ports:
            - name: api
              containerPort: {{ .Values.infra.minio.service.port }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.infra.minio.consolePort }}
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.infra.minio.env.MINIO_ROOT_USER | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.infra.minio.env.MINIO_ROOT_PASSWORD | quote }}
          livenessProbe:
            exec:
              command: ["mc", "ready", "local"]
            initialDelaySeconds: {{ .Values.infra.minio.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.infra.minio.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.infra.minio.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.infra.minio.probes.failureThreshold }}
          readinessProbe:
            exec:
              command: ["mc", "ready", "local"]
            initialDelaySeconds: {{ .Values.infra.minio.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.infra.minio.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.infra.minio.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.infra.minio.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.infra.minio.resources | nindent 12 }}
          {{- if .Values.infra.minio.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
  {{- if .Values.infra.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.infra.minio.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infra.minio.persistence.size }}
  {{- else }}
  volumes:
    - name: data
      emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: infra
spec:
  type: {{ .Values.infra.minio.service.type }}
  ports:
    - port: {{ .Values.infra.minio.service.port }}
      targetPort: api
      protocol: TCP
      name: api
    - port: {{ .Values.infra.minio.consolePort }}
      targetPort: console
      protocol: TCP
      name: console
  selector:
    app.kubernetes.io/name: {{ $name }}
{{- end }}
