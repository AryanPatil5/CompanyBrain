{{- if .Values.infra.temporalUi.enabled }}
{{- $name := include "company-brain.component" (merge (dict "suffix" "temporal-ui") .) }}
{{- $temporalAddress := printf "%s:%s" (include "company-brain.component" (merge (dict "suffix" "temporal") .)) (.Values.infra.temporal.service.port | toString) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: infra
spec:
  replicas: {{ .Values.infra.temporalUi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: infra
    spec:
      containers:
        - name: temporal-ui
          image: "{{ .Values.infra.temporalUi.image.repository }}:{{ .Values.infra.temporalUi.image.tag }}"
          imagePullPolicy: {{ .Values.infra.temporalUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.infra.temporalUi.containerPort }}
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ default $temporalAddress .Values.infra.temporalUi.temporalAddress | quote }}
            - name: TEMPORAL_CORS_ORIGINS
              value: {{ .Values.infra.temporalUi.corsOrigins | quote }}
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://localhost:{{ .Values.infra.temporalUi.containerPort }}/"]
            initialDelaySeconds: {{ .Values.infra.temporalUi.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.infra.temporalUi.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.infra.temporalUi.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.infra.temporalUi.probes.failureThreshold }}
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://localhost:{{ .Values.infra.temporalUi.containerPort }}/"]
            initialDelaySeconds: {{ .Values.infra.temporalUi.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.infra.temporalUi.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.infra.temporalUi.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.infra.temporalUi.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.infra.temporalUi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: infra
spec:
  type: {{ .Values.infra.temporalUi.service.type }}
  ports:
    - port: {{ .Values.infra.temporalUi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ $name }}
{{- end }}
